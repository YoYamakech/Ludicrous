[package]
name = "ludicrous"
version = "1.2.0"
edition = "2021"
description = "A minimal, fast C++ code editor with its own OpenGL renderer"

[dependencies]
winit = "0.30.13"
glutin = "0.32.3"
glutin-winit = "0.5.0"
glow = "0.18.0"
ropey = "1.6.1"
fontdue = "0.9.5"
arboard = { version = "3.6.1", default-features = false }
# File dialogs. `xdg-portal` is the lightweight backend: no GTK linked in, no
# portal traffic until a dialog is actually opened. `rfd` 0.18 defaults to
# [xdg-portal, wayland]; we keep only the portal, which talks over D-Bus.
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"], optional = true }
# Syntax highlighting. Pinned exactly: the grammar crates and the core crate
# must agree on the Language API, and this set is the one that compiles against
# tree-sitter 0.27 (checked by hand before pinning).
tree-sitter = { version = "0.27.2", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-toml-ng = { version = "0.7.0", optional = true }
tree-sitter-md = { version = "0.5.4", optional = true }

# Heavy, optional features. All on by default, so a plain `cargo build` is the
# full editor; turn them off for a fast edit/compile loop on the old laptop:
#   cargo build --no-default-features
#   cargo build --no-default-features --features syntax
# Each phase must build with its feature on *and* off.
#
# The dependency lists fill in as the phases land; an empty list still gives a
# real switch that the code can test with `cfg!(feature = "...")`.
[features]
default = ["syntax", "lsp", "updater", "dialogs"]
# Each grammar compiles a C parser at build time; that is the cost of the feature.
syntax = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-python",
    "dep:tree-sitter-json",
    "dep:tree-sitter-toml-ng",
    "dep:tree-sitter-md",
]
lsp = []
updater = []
dialogs = ["dep:rfd"]

# Release: small and fast. A debug build is only for working on the code.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Debug builds still need to feel responsive on the target laptop (spinning
# HDD, weak CPU). opt-level = 1 costs nothing to build and makes the renderer
# usable; lto/codegen-units stay release-only.
[profile.dev]
opt-level = 1
