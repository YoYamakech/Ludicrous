[package]
name = "ludicrous"
version = "0.1.0"
edition = "2021"
description = "A minimal, fast C++ code editor with its own OpenGL renderer"

[dependencies]
winit = "0.30.13"
glutin = "0.32.3"
glutin-winit = "0.5.0"
glow = "0.18.0"
ropey = "1.6.1"
fontdue = "0.9.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
