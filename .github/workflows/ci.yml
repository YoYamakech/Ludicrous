name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: fmt, clippy, build, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Build-time deps for winit/glutin. No display is needed: CI never opens
      # a window, it only compiles and runs the headless unit tests.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxinerama-dev \
            libwayland-dev wayland-protocols \
            libgl1-mesa-dev pkg-config

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

  release-build:
    name: release build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev \
            libxi-dev libxinerama-dev \
            libwayland-dev wayland-protocols \
            libgl1-mesa-dev pkg-config

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked

      - uses: actions/upload-artifact@v6
        with:
          name: ludicrous-linux-x86_64
          path: target/release/ludicrous
          if-no-files-found: error
